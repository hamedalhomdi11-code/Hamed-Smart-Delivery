name: Deploy Hamed Smart Delivery API to Cloudflare
on:
  workflow_dispatch:
  push:
    branches:
      - feature/implementation-4-5-6-integration-20261128
    paths:
      - "worker/**"
      - ".github/workflows/deploy-cloudflare-api.yml"
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_ACCOUNT_ID: f60cd95ac4221dd7b1ba6ec535f46f4c
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Worker dependencies
        run: npm install
      - name: Create or locate the dedicated D1 database
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API" > /tmp/hamed-d1-list.json
          DB_ID="$(node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/hamed-d1-list.json","utf8"));if(!x.success)throw new Error(JSON.stringify(x.errors));const d=(x.result||[]).find(v=>v.name==="hamed-smart-delivery-accounts");if(d)process.stdout.write(d.uuid);')"
          if [ -z "$DB_ID" ]; then
            curl -fsS -X POST "$API" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data '{"name":"hamed-smart-delivery-accounts"}' > /tmp/hamed-d1-create.json
            DB_ID="$(node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/hamed-d1-create.json","utf8"));if(!x.success)throw new Error(JSON.stringify(x.errors));process.stdout.write(x.result.uuid);')"
          fi
          if [ -z "$DB_ID" ]; then
            echo "Could not determine the dedicated D1 database ID."
            exit 1
          fi
          node -e 'const fs=require("fs");const p="wrangler.toml";const id=process.argv[1];const s=fs.readFileSync(p,"utf8");if(!s.includes("00000000-0000-0000-0000-000000000000"))throw new Error("Expected database ID placeholder missing");fs.writeFileSync(p,s.replace("00000000-0000-0000-0000-000000000000",id));' "$DB_ID"
          echo "Dedicated D1 database is ready; its identifier is intentionally not printed."
      - name: Type-check Worker
        run: npm run typecheck
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply hamed-smart-delivery-accounts --remote --config wrangler.toml

      - name: Configure optional secure Worker secrets
        env:
          ADMIN_INITIAL_PASSWORD: ${{ secrets.ADMIN_INITIAL_PASSWORD }}
          AUTH0_MGMT_CLIENT_ID: ${{ secrets.AUTH0_MGMT_CLIENT_ID }}
          AUTH0_MGMT_CLIENT_SECRET: ${{ secrets.AUTH0_MGMT_CLIENT_SECRET }}
          AUTH0_DB_CONNECTION: ${{ secrets.AUTH0_DB_CONNECTION }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          put_secret() {
            local secret_name="$1"
            local secret_value="$2"
            if [ -n "$secret_value" ]; then
              printf '%s' "$secret_value" | npx wrangler secret put "$secret_name" --config wrangler.toml
              echo "Configured Worker secret: $secret_name"
            else
              echo "Worker secret not supplied; setup remains pending: $secret_name"
            fi
          }
          put_secret ADMIN_INITIAL_PASSWORD "$ADMIN_INITIAL_PASSWORD"
          put_secret AUTH0_MGMT_CLIENT_ID "$AUTH0_MGMT_CLIENT_ID"
          put_secret AUTH0_MGMT_CLIENT_SECRET "$AUTH0_MGMT_CLIENT_SECRET"
          put_secret AUTH0_DB_CONNECTION "$AUTH0_DB_CONNECTION"

      - name: Verify Auth0 Management API credentials and granted scopes
        env:
          AUTH0_MGMT_CLIENT_ID: ${{ secrets.AUTH0_MGMT_CLIENT_ID }}
          AUTH0_MGMT_CLIENT_SECRET: ${{ secrets.AUTH0_MGMT_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          if [ -z "$AUTH0_MGMT_CLIENT_ID" ] || [ -z "$AUTH0_MGMT_CLIENT_SECRET" ]; then
            echo "::error::Auth0 Management M2M credentials are missing from GitHub Secrets."
            exit 1
          fi
          TOKEN_HTTP="$(curl -sS -o /tmp/hamed-auth0-token.json -w '%{http_code}' \
            -X POST "https://dev-sm0yv5i1vy4kqhz8.us.auth0.com/oauth/token" \
            -H "Content-Type: application/json" \
            --data "$(node -e 'process.stdout.write(JSON.stringify({grant_type:"client_credentials",client_id:process.env.AUTH0_MGMT_CLIENT_ID,client_secret:process.env.AUTH0_MGMT_CLIENT_SECRET,audience:"https://dev-sm0yv5i1vy4kqhz8.us.auth0.com/api/v2/",scope:"create:users read:users update:users delete:users"}))')")"
          if [ "$TOKEN_HTTP" != "200" ]; then
            node -e 'const x=JSON.parse(require("fs").readFileSync("/tmp/hamed-auth0-token.json","utf8"));console.error("Auth0 token request rejected:",String(x.error||"unknown_error").slice(0,80),String(x.error_description||"").replace(/[\\r\\n]+/g," ").slice(0,180));'
            exit 1
          fi
          node <<'NODE'
          const fs = require("fs");
          const result = JSON.parse(fs.readFileSync("/tmp/hamed-auth0-token.json", "utf8"));
          if (typeof result.access_token !== "string" || !result.access_token) throw new Error("Auth0 returned no access token.");
          const parts = result.access_token.split(".");
          if (parts.length !== 3) throw new Error("Auth0 Management token was not a JWT; granted scopes cannot be verified safely.");
          const payload = JSON.parse(Buffer.from(parts[1], "base64url").toString("utf8"));
          const scopes = new Set(String(payload.scope || "").split(/\s+/).filter(Boolean));
          const required = ["create:users", "read:users", "update:users", "delete:users"];
          const missing = required.filter(scope => !scopes.has(scope));
          if (missing.length) throw new Error("Auth0 token is missing required scopes: " + missing.join(", "));
          if (typeof result.expires_in !== "number" || result.expires_in <= 0) throw new Error("Auth0 token expiry is invalid.");
          fs.writeFileSync("/tmp/hamed-auth0-access-token.txt", result.access_token, { mode: 0o600 });
          console.log("Auth0 issued a Management API token with all four required scopes and a valid expiry.");
          NODE
          READ_HTTP="$(curl -sS -o /tmp/hamed-auth0-read-check.json -w '%{http_code}' \
            -H "Authorization: Bearer $(cat /tmp/hamed-auth0-access-token.txt)" \
            "https://dev-sm0yv5i1vy4kqhz8.us.auth0.com/api/v2/users?per_page=1&include_totals=false")"
          if [ "$READ_HTTP" != "200" ]; then
            echo "::error::Auth0 Management token was issued but the read-users permission check failed (HTTP $READ_HTTP)."
            exit 1
          fi
          rm -f /tmp/hamed-auth0-token.json /tmp/hamed-auth0-access-token.txt /tmp/hamed-auth0-read-check.json
          echo "Auth0 Management API token and read permission verified; no user was created or modified."
      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.toml

      - name: Verify deployed Worker and remote D1 health
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_URL="https://hamed-smart-delivery-api.hamedalhomdi11.workers.dev/health"
          for attempt in $(seq 1 10); do
            if curl -fsS "$HEALTH_URL" -o /tmp/hamed-worker-health.json; then
              node -e 'const x=JSON.parse(require("fs").readFileSync("/tmp/hamed-worker-health.json","utf8"));if(x.ok!==true||x.database!=="connected")throw new Error("Worker or D1 health check did not pass");console.log("Worker health and D1 connectivity verified.");'
              exit 0
            fi
            sleep 6
          done
          echo "::error::Worker health endpoint did not become ready or D1 is unavailable."
          exit 1
      - name: Verify Auth0 and admin bootstrap configuration
        shell: bash
        run: |
          set -euo pipefail
          SETUP_URL="https://hamed-smart-delivery-api.hamedalhomdi11.workers.dev/v1/admin/setup"
          curl -fsS "$SETUP_URL" -o /tmp/hamed-worker-setup.json
          node -e 'const x=JSON.parse(require("fs").readFileSync("/tmp/hamed-worker-setup.json","utf8"));if(x.ready!==true||x.adminBootstrapConfigured!==true||x.auth0ManagementConfigured!==true)throw new Error("Admin bootstrap or Auth0 Management configuration is incomplete");console.log("Admin bootstrap and Auth0 Management configuration verified.");'
