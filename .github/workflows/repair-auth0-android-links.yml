name: Repair Auth0 Android App Links
on:
  push:
    branches:
      - feature/implementation-4-5-6-integration-20261128
    paths:
      - .github/workflows/repair-auth0-android-links.yml
permissions:
  contents: read
jobs:
  register-android-app-link:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtain short-lived Management API token
        id: token
        env:
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_MGMT_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_MGMT_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$AUTH0_CLIENT_ID"
          test -n "$AUTH0_CLIENT_SECRET"
          response="$(curl --fail-with-body --silent --show-error \
            -X POST "https://dev-sm0yv5i1vy4kqhz8.us.auth0.com/oauth/token" \
            -H "content-type: application/json" \
            --data "$(jq -n --arg id "$AUTH0_CLIENT_ID" --arg secret "$AUTH0_CLIENT_SECRET" \
              '{client_id:$id,client_secret:$secret,audience:"https://dev-sm0yv5i1vy4kqhz8.us.auth0.com/api/v2/",grant_type:"client_credentials",scope:"update:clients"}')")"
          token="$(jq -er '.access_token' <<<"$response")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Register the exact Android package and current APK signing certificate
        env:
          MANAGEMENT_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X PATCH "https://dev-sm0yv5i1vy4kqhz8.us.auth0.com/api/v2/clients/rfttwF5wZW5RKdsaLkWSnvXuwlNyuwXD" \
            -H "authorization: Bearer $MANAGEMENT_TOKEN" \
            -H "content-type: application/json" \
            --data '{"mobile":{"android":{"app_package_name":"com.hamed.smartdelivery","sha256_cert_fingerprints":["8F:27:F7:39:40:07:FA:5E:7E:DE:9F:5F:A5:E5:45:07:F8:8A:AF:03:00:74:8D:3A:9F:94:5A:F9:3A:B8:B7:90"]}}}' \
            -o /tmp/auth0-client-update.json
          echo "Android package and SHA-256 fingerprint submitted."
      - name: Verify Auth0 publishes the Android App Link association
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error \
              "https://dev-sm0yv5i1vy4kqhz8.us.auth0.com/.well-known/assetlinks.json" \
              -o /tmp/assetlinks.json; then
              if python3 - <<'PY'
          import json
          p = "com.hamed.smartdelivery"
          f = "8F:27:F7:39:40:07:FA:5E:7E:DE:9F:5F:A5:E5:45:07:F8:8A:AF:03:00:74:8D:3A:9F:94:5A:F9:3A:B8:B7:90"
          data = json.load(open("/tmp/assetlinks.json"))
          ok = any(
              item.get("target", {}).get("namespace") == "android_app"
              and item.get("target", {}).get("package_name") == p
              and f in item.get("target", {}).get("sha256_cert_fingerprints", [])
              and "delegate_permission/common.handle_all_urls" in item.get("relation", [])
              for item in data
          )
          if not ok:
              raise SystemExit("Android App Link association not present yet")
          print("Verified: Auth0 assetlinks.json contains the exact package and APK signing fingerprint.")
          PY
              then exit 0; fi
            fi
            sleep 5
          done
          echo "::error::Auth0 assetlinks.json did not publish the expected association."
          cat /tmp/assetlinks.json || true
          exit 1
