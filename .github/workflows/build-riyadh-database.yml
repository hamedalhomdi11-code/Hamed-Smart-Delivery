name: Build Riyadh places database
on:
  push:
    paths:
      - "database/**"
      - ".github/workflows/build-riyadh-database.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install data tools
        run: |
          python -m pip install --upgrade pip pandas pyarrow shapely requests overturemaps==2.1.1
          sudo apt-get update
          sudo apt-get install -y osmium-tool
      - name: Download Saudi POI source from Hugging Face
        run: |
          mkdir -p data/source data/output
          curl -L --fail --retry 5 --retry-all-errors \
            "https://huggingface.co/datasets/Bayanat-Labs/arab-world-places-atlas/resolve/main/data/places/places-SA.parquet?download=true" \
            -o data/source/places-SA.parquet
          test -s data/source/places-SA.parquet
      - name: Build base SQLite database
        run: python database/build_riyadh_atlas.py data/source/places-SA.parquet data/output/hamed_smart_delivery_riyadh.sqlite
      - name: Download latest official Overture Places for Riyadh
        run: |
          overturemaps download \
            --bbox=46.20,24.05,47.35,25.15 \
            -f geoparquet --type=place \
            -o data/source/overture-riyadh-places.parquet
          test -s data/source/overture-riyadh-places.parquet
          python database/sync_riyadh_overture.py \
            data/output/hamed_smart_delivery_riyadh.sqlite \
            data/source/overture-riyadh-places.parquet | tee data/output/overture_sync.report.json
      - name: Import additional Wikidata points of interest
        continue-on-error: true
        run: |
          set -o pipefail
          if python database/sync_riyadh_wikidata.py data/output/hamed_smart_delivery_riyadh.sqlite | tee data/output/wikidata_sync.report.json; then
            echo "Wikidata import completed."
          else
            printf '%s\n' '{"status":"unavailable","source":"Wikidata Query Service","error":"Wikidata request failed; optional source skipped so the other licensed sources and derived clusters can still be built."}' > data/output/wikidata_sync.report.json
            echo "::warning::Wikidata unavailable; continuing with Overture and OpenStreetMap."
          fi
      - name: Download and extract current OpenStreetMap GCC data
        continue-on-error: true
        run: |
          curl -L --fail --retry 5 --retry-all-errors \
            "https://download.geofabrik.de/asia/gcc-states-latest.osm.pbf" \
            -o data/source/gcc-states-latest.osm.pbf
          test -s data/source/gcc-states-latest.osm.pbf
          osmium extract -b 46.20,24.05,47.35,25.15 \
            data/source/gcc-states-latest.osm.pbf \
            -o data/source/riyadh.osm.pbf --overwrite
          # Broad named POI collection: retail + food + services + public facilities.
          # The importer retains each source object ID and skips unnamed features.
          osmium tags-filter data/source/riyadh.osm.pbf \
            nwr/shop \
            nwr/amenity=restaurant,fast_food,cafe,ice_cream,food_court,pharmacy,bank,atm,clinic,hospital,doctors,dentist,school,university,college,kindergarten,language_school,driving_school,post_office,parcel_locker,marketplace,community_centre,library,fuel,charging_station,parking,bus_station,car_wash,car_rental,car_sharing,car_repair,veterinary,childcare,cinema,theatre,arts_centre,events_venue,nightclub,bar,pub,place_of_worship,police,fire_station,courthouse,prison,social_facility,shelter,toilets,drinking_water,public_bath,recycling,waste_disposal,animal_shelter,studio,conference_centre,exhibition_centre,public_building \
            nwr/healthcare \
            nwr/education \
            nwr/tourism=hotel,motel,guest_house,hostel,attraction,museum,artwork,information,viewpoint,theme_park,zoo,aquarium,gallery,apartment \
            nwr/leisure=fitness_centre,sports_centre,stadium,swimming_pool,park,garden,playground,pitch,golf_course,water_park,escape_game,amusement_arcade,bowling_alley,miniature_golf,marina \
            nwr/sport \
            nwr/craft \
            nwr/office \
            nwr/public_transport=station,platform,stop_position \
            nwr/highway=bus_stop,services \
            nwr/railway=station,halt \
            nwr/emergency \
            nwr/aeroway=aerodrome,terminal \
            nwr/club \
            -o data/source/riyadh-pois.osm.pbf --overwrite
          osmium export data/source/riyadh-pois.osm.pbf \
            --add-unique-id=type_id \
            -o data/source/riyadh-pois.geojson --overwrite
          test -s data/source/riyadh-pois.geojson
      - name: Merge OpenStreetMap POIs into SQLite
        if: ${{ hashFiles('data/source/riyadh-pois.geojson') != '' }}
        run: |
          python database/sync_riyadh_geofabrik.py \
            data/output/hamed_smart_delivery_riyadh.sqlite \
            data/source/riyadh-pois.geojson | tee data/output/osm_sync.report.json
          python - <<'PY'
          import json, sqlite3
          db = "data/output/hamed_smart_delivery_riyadh.sqlite"
          report_path = db + ".report.json"
          report = json.load(open(report_path, encoding="utf-8"))
          osm = json.load(open("data/output/osm_sync.report.json", encoding="utf-8"))
          overture = json.load(open("data/output/overture_sync.report.json", encoding="utf-8"))
          con = sqlite3.connect(db)
          report["overture_sync"] = overture
          report["osm_sync"] = osm
          report["merged_active_places_total"] = con.execute(
              "SELECT COUNT(*) FROM places WHERE is_active=1"
          ).fetchone()[0]
          report["merged_category_counts"] = dict(con.execute(
              "SELECT category, COUNT(*) FROM places WHERE is_active=1 GROUP BY category"
          ).fetchall())
          report["source_counts"] = dict(con.execute(
              "SELECT source_id, COUNT(*) FROM places WHERE is_active=1 GROUP BY source_id"
          ).fetchall())
          report["source_attribution"] = {
              "OpenStreetMap": "© OpenStreetMap contributors, ODbL 1.0",
              "Overture Maps latest": "CDLA-Permissive-2.0 / Apache-2.0 / CC0-1.0 by source provider; see Overture Places licensing",
              "Bayanat/Overture historical base": "Per-record source_licenses; see DATA_LICENSE.md"
          }
          json.dump(report, open(report_path, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          con.close()
          print(json.dumps(report, ensure_ascii=False))
          PY
      - name: Derive restaurant density clusters and centroid coordinates
        run: |
          python database/derive_riyadh_restaurant_clusters.py \
            data/output/hamed_smart_delivery_riyadh.sqlite \
            data/output/restaurant_clusters.report.json
          python - <<'PY'
          import json, sqlite3
          db = "data/output/hamed_smart_delivery_riyadh.sqlite"
          report_path = db + ".report.json"
          report = json.load(open(report_path, encoding="utf-8"))
          clusters = json.load(open("data/output/restaurant_clusters.report.json", encoding="utf-8"))
          con = sqlite3.connect(db)
          report["restaurant_clusters"] = {
              k: v for k, v in clusters.items() if k != "clusters"
          }
          report["restaurant_cluster_count"] = con.execute(
              "SELECT COUNT(*) FROM restaurant_clusters"
          ).fetchone()[0]
          report["restaurant_cluster_member_count"] = con.execute(
              "SELECT COUNT(*) FROM restaurant_cluster_members"
          ).fetchone()[0]
          json.dump(report, open(report_path, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          con.close()
          print(json.dumps(report["restaurant_clusters"], ensure_ascii=False))
          PY
      - name: Build category-separated restaurant and cafe hotspot layer v2
        run: |
          python database/build_riyadh_food_hotspots_v2.py \
            data/output/hamed_smart_delivery_riyadh.sqlite \
            data/output/food_density_clusters_v2.report.json
          python - <<'PY'
          import json, sqlite3
          db = "data/output/hamed_smart_delivery_riyadh.sqlite"
          report_path = db + ".report.json"
          report = json.load(open(report_path, encoding="utf-8"))
          hotspots = json.load(open("data/output/food_density_clusters_v2.report.json", encoding="utf-8"))
          con = sqlite3.connect(db)
          report["food_density_clusters_v2"] = {k:v for k,v in hotspots.items() if k != "clusters"}
          report["food_density_clusters_v2"]["cluster_table"] = "food_density_clusters_v2"
          report["food_density_clusters_v2"]["membership_table"] = "food_density_cluster_members_v2"
          json.dump(report, open(report_path, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          con.close()
          PY
      - name: Audit possible cross-source duplicate locations
        run: |
          python database/audit_riyadh_cross_source.py \
            data/output/hamed_smart_delivery_riyadh.sqlite \
            data/output/cross_source_duplicate_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          report_path = Path("data/output/hamed_smart_delivery_riyadh.sqlite.report.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          audit = json.loads(Path("data/output/cross_source_duplicate_audit.json").read_text(encoding="utf-8"))
          report["cross_source_duplicate_audit"] = {
              k: v for k, v in audit.items() if k != "examples"
          }
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        with:
          name: hamed-smart-delivery-riyadh-database
          path: |
            data/output/hamed_smart_delivery_riyadh.sqlite
            data/output/hamed_smart_delivery_riyadh.sqlite.report.json
            data/output/osm_sync.report.json
            data/output/overture_sync.report.json
            data/output/wikidata_sync.report.json
            data/output/restaurant_clusters.report.json
            data/output/cross_source_duplicate_audit.json
          retention-days: 30
