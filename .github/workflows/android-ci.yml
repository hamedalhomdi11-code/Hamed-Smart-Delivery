name: Android CI
permissions:
  actions: read
  contents: read
on:
  push:
    branches: [ main, develop, "release/**", "feature/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest successful Riyadh database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-riyadh-database.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          test -n "$RUN_ID" || { echo "::error::No successful Riyadh database workflow run was found"; exit 1; }
          mkdir -p "$RUNNER_TEMP/riyadh-database" app/src/main/assets
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name hamed-smart-delivery-riyadh-database --dir "$RUNNER_TEMP/riyadh-database"
          DB_FILE="$(find "$RUNNER_TEMP/riyadh-database" -type f -name hamed_smart_delivery_riyadh.sqlite -print -quit)"
          test -n "$DB_FILE" || { echo "::error::SQLite database missing from downloaded artifact"; exit 1; }
          python3 - "$DB_FILE" <<'PY'
          import sqlite3, sys
          db = sqlite3.connect(f"file:{sys.argv[1]}?mode=ro", uri=True)
          assert db.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
          assert db.execute("SELECT COUNT(*) FROM food_density_clusters_v3").fetchone()[0] > 0
          assert db.execute("SELECT COUNT(*) FROM places WHERE category='pharmacy' AND is_active=1").fetchone()[0] > 0
          print("Riyadh SQLite integrity and v3/pharmacy tables verified")
          db.close()
          PY
          cp "$DB_FILE" app/src/main/assets/hamed_smart_delivery_riyadh.sqlite
          sha256sum app/src/main/assets/hamed_smart_delivery_riyadh.sqlite
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and test
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK and record signing certificate
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          if grep -qi "d3b2bf8543613c14234bfc4a28d21b96631c8320ceeea666fba43b483afb6657" apk-signature.txt; then
            echo "UPDATE_COMPATIBLE_WITH_PREVIOUS_APK=true" | tee -a apk-signature.txt
          else
            echo "::warning::APK signing certificate differs from the previously delivered APK; Android will reject an in-place update."
            echo "UPDATE_COMPATIBLE_WITH_PREVIOUS_APK=false" | tee -a apk-signature.txt
          fi
      - name: Upload APK and signature report
        uses: actions/upload-artifact@v4
        with:
          name: hamed-smart-delivery-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-signature.txt
          if-no-files-found: error
      - name: Run Android emulator smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: gradle --no-daemon :app:connectedDebugAndroidTest
