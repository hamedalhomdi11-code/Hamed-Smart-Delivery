name: Android CI
on:
  push:
    branches: [ main, develop, "release/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and test
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Run Android emulator smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Verify APK and record signing certificate
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          if grep -qi "d3b2bf8543613c14234bfc4a28d21b96631c8320ceeea666fba43b483afb6657" apk-signature.txt; then
            echo "UPDATE_COMPATIBLE_WITH_PREVIOUS_APK=true" | tee -a apk-signature.txt
          else
            echo "::warning::APK signing certificate differs from the previously delivered APK; Android will reject an in-place update."
            echo "UPDATE_COMPATIBLE_WITH_PREVIOUS_APK=false" | tee -a apk-signature.txt
          fi
      - name: Upload APK and signature report
        uses: actions/upload-artifact@v4
        with:
          name: hamed-smart-delivery-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-signature.txt
          if-no-files-found: error
